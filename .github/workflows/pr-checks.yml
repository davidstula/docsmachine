name: Lint and check if a pull request will build

on:
  pull_request:
    branches: "master"
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.markdownlint.jsonc'
      - '.github/ai-review/**'
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v7

      - name: Lint all markdown files under the docs directory
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: '.markdownlint.jsonc'
          globs: 'docs/**/*.md'

      - name: Set up mkdocs
        run: pip install mkdocs

      - name: Build the docs site
        run: mkdocs build --strict

  ai-review:
    name: AI documentation review
    needs: lint
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the proposed merge with its history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the AI review dependency
        working-directory: .github/ai-review
        run: npm ci

      - name: Review the pull request
        run: node .github/ai-review/review.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
